name: TopDirect DAT

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # ==========================
      # Download source
      # ==========================
      - name: Download TopDirect.ruleset
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/Yumega/DaeRules/main/rawrule/TopDirect.ruleset \
            -o /tmp/TopDirect.ruleset

          echo "===== Source ====="
          cat /tmp/TopDirect.ruleset

      # ==========================
      # Build GeoSite DAT
      # ==========================
      - name: Build top-direct.dat
        run: |
          rm -rf /tmp/domain-data
          rm -rf /tmp/domain-output

          mkdir -p /tmp/domain-data
          mkdir -p /tmp/domain-output

          awk -F',' '
            /^DOMAIN,/ {
              v=$2
              gsub(/\r/, "", v)
              if (v != "") print "full:" v
            }

            /^DOMAIN-SUFFIX,/ {
              v=$2
              gsub(/\r/, "", v)
              if (v != "") print "domain:" v
            }

            /^DOMAIN-KEYWORD,/ {
              v=$2
              gsub(/\r/, "", v)
              if (v != "") print "keyword:" v
            }
          ' /tmp/TopDirect.ruleset \
          | sort -u \
          > /tmp/domain-data/top-direct

          echo "===== GeoSite source ====="
          cat /tmp/domain-data/top-direct

          git clone --depth 1 \
            https://github.com/v2fly/domain-list-community.git \
            /tmp/domain-list-community

          cd /tmp/domain-list-community

          go mod download

          go run ./ \
            --datapath=/tmp/domain-data \
            --outputname=top-direct.dat \
            --outputdir=/tmp/domain-output

          cp /tmp/domain-output/top-direct.dat \
            "$GITHUB_WORKSPACE/top-direct.dat"

          echo "===== Generated GeoSite DAT ====="
          ls -lh "$GITHUB_WORKSPACE/top-direct.dat"

      # ==========================
      # Extract IP
      # ==========================
      - name: Extract IP-CIDR
        run: |
          rm -rf /tmp/geoip
          mkdir -p /tmp/geoip

          awk -F',' '
            /^IP-CIDR,/ {
              v=$2

              gsub(/\r/, "", v)

              # Restore Clash IPv6 escaping
              gsub(/\\:/, ":", v)

              if (v != "") print v
            }
          ' /tmp/TopDirect.ruleset \
          | sort -u \
          > /tmp/geoip/top-direct-ip.txt

          echo "===== GeoIP source ====="
          cat /tmp/geoip/top-direct-ip.txt

          echo
          echo "===== Count ====="
          wc -l /tmp/geoip/top-direct-ip.txt

      # ==========================
      # Build GeoIP DAT
      # ==========================
      - name: Build top-direct-ip.dat
        run: |
          git clone --depth 1 \
            https://github.com/v2fly/geoip.git \
            /tmp/geoip-src

          cd /tmp/geoip-src

          go mod download

          cat > config.json <<'EOF'
          {
            "input": [
              {
                "type": "text",
                "action": "add",
                "args": {
                  "name": "TOP-DIRECT-IP",
                  "uri": "/tmp/geoip/top-direct-ip.txt"
                }
              }
            ],
            "output": [
              {
                "type": "v2rayGeoIPDat",
                "action": "output",
                "args": {
                  "outputName": "top-direct-ip.dat"
                }
              }
            ]
          }
          EOF

          echo "===== GeoIP config ====="
          cat config.json

          go run ./ -c config.json

          cp output/dat/top-direct-ip.dat \
            "$GITHUB_WORKSPACE/top-direct-ip.dat"

          echo "===== Generated GeoIP DAT ====="
          ls -lh "$GITHUB_WORKSPACE/top-direct-ip.dat"

      # ==========================
      # Validate
      # ==========================
      - name: Validate generated files
        run: |
          set -e

          test -s top-direct.dat
          test -s top-direct-ip.dat

          echo "===== Files ====="
          ls -lh top-direct.dat top-direct-ip.dat

          echo
          echo "===== GeoSite ====="
          strings top-direct.dat | head -30

          echo
          echo "===== GeoIP ====="
          strings top-direct-ip.dat | head -30

      # ==========================
      # Commit
      # ==========================
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add top-direct.dat top-direct-ip.dat

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update TopDirect DAT"
            git push
          fi
