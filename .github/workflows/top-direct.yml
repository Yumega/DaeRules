name: TopDirect DAT

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # =========================
      # 2. Download source ruleset
      # =========================
      - name: Download TopDirect.ruleset
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/Yumega/DaeRules/main/rawrule/TopDirect.ruleset \
            -o /tmp/TopDirect.ruleset

          echo "===== Source ruleset ====="
          cat /tmp/TopDirect.ruleset

      # =========================
      # 3. Build GeoSite DAT
      # =========================
      - name: Build top-direct.dat
        run: |
          rm -rf /tmp/domain-data
          rm -rf /tmp/domain-output

          mkdir -p /tmp/domain-data
          mkdir -p /tmp/domain-output

          # DOMAIN              -> full:
          # DOMAIN-SUFFIX       -> domain:
          # DOMAIN-KEYWORD      -> keyword:
          #
          # 只处理 DOMAIN*，IP-CIDR 不进入 GeoSite DAT。
          awk -F',' '
            /^DOMAIN,/ {
              value=$2
              gsub(/\r/, "", value)
              if (value != "") print "full:" value
            }

            /^DOMAIN-SUFFIX,/ {
              value=$2
              gsub(/\r/, "", value)
              if (value != "") print "domain:" value
            }

            /^DOMAIN-KEYWORD,/ {
              value=$2
              gsub(/\r/, "", value)
              if (value != "") print "keyword:" value
            }
          ' /tmp/TopDirect.ruleset \
          | sort -u \
          > /tmp/domain-data/top-direct

          echo "===== Converted GeoSite source ====="
          cat /tmp/domain-data/top-direct

          echo "===== Clone domain-list-community ====="
          git clone --depth 1 \
            https://github.com/v2fly/domain-list-community.git \
            /tmp/domain-list-community

          cd /tmp/domain-list-community

          go mod download

          go run ./ \
            --datapath=/tmp/domain-data \
            --outputname=top-direct.dat \
            --outputdir=/tmp/domain-output

          cp /tmp/domain-output/top-direct.dat \
            "$GITHUB_WORKSPACE/top-direct.dat"

          echo "===== Generated top-direct.dat ====="
          ls -lh "$GITHUB_WORKSPACE/top-direct.dat"

      # =========================
      # 4. Extract IP rules
      # =========================
      - name: Extract IP CIDR rules
        run: |
          rm -rf /tmp/geoip
          mkdir -p /tmp/geoip

          awk -F',' '
            /^IP-CIDR,/ {
              value=$2

              # CRLF -> LF
              gsub(/\r/, "", value)

              # Clash/Mihomo IPv6 escaping:
              # 2620\:149\:a44::/48
              # ->
              # 2620:149:a44::/48
              gsub(/\\:/, ":", value)

              if (value != "") print value
            }
          ' /tmp/TopDirect.ruleset \
          | sort -u \
          > /tmp/geoip/top-direct-ip.txt

          echo "===== Converted GeoIP source ====="
          cat /tmp/geoip/top-direct-ip.txt

          echo
          echo "===== Number of IP rules ====="
          wc -l /tmp/geoip/top-direct-ip.txt

      # =========================
      # 5. Build GeoIP DAT
      # =========================
      - name: Build top-direct-ip.dat
        run: |
          git clone --depth 1 \
            https://github.com/v2fly/geoip.git \
            /tmp/geoip-src

          cd /tmp/geoip-src

          go mod download

          cat > config.json <<'EOF'
          {
            "input": [
              {
                "type": "text",
                "action": "add",
                "args": {
                  "name": "TOP-DIRECT-IP",
                  "uri": "/tmp/geoip/top-direct-ip.txt"
                }
              }
            ],
            "output": [
              {
                "type": "v2rayGeoIPDat",
                "action": "output",
                "args": {
                  "outputDir": "/tmp/geoip/output",
                  "outputName": "top-direct-ip.dat",
                  "wantedList": [
                    "TOP-DIRECT-IP"
                  ]
                }
              }
            ]
          }
          EOF

          mkdir -p /tmp/geoip/output

          echo "===== GeoIP config ====="
          cat config.json

          go run ./ -c config.json

          cp /tmp/geoip/output/top-direct-ip.dat \
            "$GITHUB_WORKSPACE/top-direct-ip.dat"

          echo "===== Generated top-direct-ip.dat ====="
          ls -lh "$GITHUB_WORKSPACE/top-direct-ip.dat"

      # =========================
      # 6. Basic validation
      # =========================
      - name: Validate generated DAT files
        run: |
          set -e

          test -s top-direct.dat
          test -s top-direct-ip.dat

          echo "===== File type / size ====="
          ls -lh top-direct.dat top-direct-ip.dat

          echo
          echo "===== GeoSite DAT strings ====="
          strings top-direct.dat | head -30

          echo
          echo "===== GeoIP DAT strings ====="
          strings top-direct-ip.dat | head -30

      # =========================
      # 7. Commit if changed
      # =========================
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add top-direct.dat top-direct-ip.dat

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update TopDirect DAT"
            git push
          fi
